title: মাসনুনের কবিতা
description: |
  ছন্দে ছন্দে আমি গেয়ে যাই
  বিরহ, প্রেম আর দুষ্টুমির গল্প
author: আবু আশরাফ মাসনুন
lang: bn

# Apex custom domain serves at root, so baseurl is empty.
baseurl: ""
url: "https://kobita.xyz"

# Display order for tags. Tags not listed here appear after, alphabetically.
tag_order:
  - বিরহ
  - প্রেম
  - দুষ্টুমি

# English URL slug for each tag, used in #hash anchors. Add an entry per tag.
# Tags without an entry fall back to slugify (mangles Bengali) — keep this full.
tag_slugs:
  বিরহ: biroho
  প্রেম: prem
  দুষ্টুমি: dushtumi

# Poems live in the _poems collection and each render to its own page.
collections:
  poems:
    output: true
    permalink: /poems/:name/

# Default front matter so individual poems do not need to repeat layout.
defaults:
  - scope:
      path: ""
      type: poems
    values:
      layout: poem

markdown: kramdown
# Single newline = line break. Lets you write verse naturally, no trailing spaces.
kramdown:
  hard_wrap: true
permalink: pretty

# Files Jekyll should ignore.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
